<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>md2book</title>
  <meta name="description" content="Read a folder of Markdown notes (an Obsidian vault works as-is) as a book, right in your browser." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f1f3f4;
      --ink: #232527;
      --muted: #72777b;
      --rule: #aeb5ba;
      --serif: "Libertinus Serif", "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--paper); color: var(--ink); font-family: var(--serif); }
    #page { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--paper); }
    [hidden] { display: none !important; }

    .screen {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 48px 16px;
    }
    .sheet { width: min(100%, 30rem); }
    h1 {
      margin: 0 0 0.2em;
      font-weight: 400;
      font-size: 2.6rem;
      letter-spacing: 0.01em;
    }
    .lede { margin: 0 0 1.8em; font-size: 1.15rem; line-height: 1.45; }
    .lede em { font-style: italic; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }
    button {
      font: inherit;
      font-size: 1.05rem;
      padding: 0.55em 1.2em;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
    }
    button.secondary { background: transparent; color: var(--ink); }
    button:focus-visible { outline: 2px solid var(--muted); outline-offset: 2px; }
    .notes {
      margin: 2.2em 0 0;
      padding: 1.1em 0 0;
      border-top: 1px solid var(--rule);
      color: var(--muted);
      font-size: 0.95rem;
      line-height: 1.5;
    }
    .notes p { margin: 0 0 0.7em; }
    .notes a { color: inherit; }
    #error { color: #a33; margin-top: 1em; }
    .sheet { position: relative; }
    .lang { position: absolute; top: 0.6rem; right: 0; display: flex; gap: 0.2rem; }
    .lang button {
      font-size: 0.85rem;
      padding: 0.2em 0.55em;
      background: transparent;
      color: var(--muted);
      border-color: transparent;
    }
    .lang button[aria-pressed="true"] { color: var(--ink); border-color: var(--rule); }
  </style>
</head>
<body>
  <main id="language" class="screen" hidden>
    <div class="sheet">
      <h1>md2book</h1>
      <p class="lede">Choose a language<br />选择语言</p>
      <div class="actions">
        <button type="button" data-choose-lang="en">English</button>
        <button type="button" data-choose-lang="zh">中文</button>
      </div>
    </div>
  </main>
  <main id="landing" class="screen" hidden>
    <div class="sheet">
      <div class="lang" role="group" aria-label="Language">
        <button type="button" data-lang="en">EN</button>
        <button type="button" data-lang="zh">中文</button>
      </div>
      <h1>md2book</h1>
      <p class="lede" data-t="lede"></p>
      <div class="actions">
        <button id="reopen" type="button" hidden></button>
        <button id="pick" type="button" class="secondary" data-t="pick"></button>
      </div>
      <input id="folder-input" type="file" webkitdirectory multiple hidden />
      <p id="error" hidden></p>
      <div class="notes">
        <p data-t="private"></p>
        <p id="browser-note" data-t="browserNote" hidden></p>
        <p data-t="share"></p>
      </div>
    </div>
  </main>
  <iframe id="page" title="md2book" hidden></iframe>
  <script type="module" src="app.js"></script>
</body>
</html>
