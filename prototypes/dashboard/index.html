<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Dashboard prototype v2 — md2book</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@400;500;600&family=Libertinus+Serif:ital,wght@0,400;0,600;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,300..700;1,8..60,300..700&display=swap" rel="stylesheet" />
<style>
:root {
  --desk: #6f7478; --paper: #f4f6f7; --ink: #232527; --muted: #72777b; --rule: #aeb5ba;
  --index-bg: #eceff1;
  --ui: "iA Writer Quattro V","Sarasa Mono HC","Sarasa Fixed SC",ui-sans-serif,system-ui,sans-serif;
  --serif: var(--ui); --title-serif: var(--ui); --caps: var(--ui);
  --book: "Source Serif 4","Songti SC","STSong","Noto Serif CJK SC",Georgia,serif; /* only text that is the book's own */
  --line: #8a949b;
}
* { box-sizing: border-box; }
html { background: var(--index-bg); }
body { margin: 0; color: var(--ink); font-family: var(--serif); background: var(--index-bg); padding: 0 24px 130px; }
button { font: inherit; color: inherit; cursor: pointer; }

/* ---- prototype chrome ---- */
.proto-bar { position: sticky; top: 0; z-index: 60; margin: 0 -24px 34px; padding: 9px 24px; background: #232527; color: #cfd3d6; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }
.proto-bar b { font-weight: 600; margin: 0 6px 0 0; letter-spacing: .06em; font-size: 11px; text-transform: uppercase; color: #9aa0a4; }
.proto-bar button { background: none; border: 1px solid #4a4e52; border-radius: 999px; padding: 3px 13px; color: #cfd3d6; }
.proto-bar button[aria-pressed=true] { background: #f1f3f4; color: #232527; border-color: #f1f3f4; }
.proto-bar .sp { flex: 1; min-width: 12px; } .proto-bar .gap { width: 18px; }

/* ---- home chrome (as the real home) ---- */
.home { max-width: 1120px; margin: 0 auto; position: relative; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 34px; }
.brand { font: 500 22px var(--caps); letter-spacing: .22em; text-transform: uppercase; }



.kicker { font: 500 12px var(--caps); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 14px; margin: 0 0 22px; }

.kicker small { font: italic 12px var(--serif); letter-spacing: 0; text-transform: none; }
.kicker a { font: 11px var(--serif); letter-spacing: .06em; color: var(--muted); text-decoration: none; order: 3; } .kicker a:hover { color: var(--ink); }
section.zone { margin-bottom: 52px; }

/* ================================================================
   Shelf: the first prototype's bookcase (frame, boards, tags),
   holding simpleshelf's 3D books (MIT, kat3samsin) — with thickness
   driven by word count.
   ================================================================ */
.case { margin-bottom: 34px; position: relative; }
.case-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 8px; padding: 0 4px; }
.case-head h3 { margin: 0; font: 500 13px var(--caps); letter-spacing: .16em; text-transform: uppercase; }
.case-head .n { font: italic 12px var(--serif); color: var(--muted); }
.chips { display: flex; gap: 4px 6px; flex-wrap: wrap; margin-left: auto; }
.chip { border: 1px solid transparent; background: none; padding: 0 8px; font: 11px/20px var(--ui); letter-spacing: -.01em; color: var(--muted); border-radius: 999px; }
.chip:hover { color: var(--ink); border-color: var(--rule); }
.chip.on { background: #232527; color: #f1f3f4; }
.chip .d { opacity: .55; margin-left: 4px; font-size: 11px; }
.frame { background: linear-gradient(#dfe2e4,#e6e8e9); box-shadow: inset 0 8px 14px -8px rgba(0,0,0,.28), inset 8px 0 12px -10px rgba(0,0,0,.25), inset -8px 0 12px -10px rgba(0,0,0,.25); border: 1px solid #c3c8cb; padding: 4px 24px 0; }
.shelf { position: relative; padding-top: 26px; }
.row { display: flex; align-items: flex-end; min-height: 120px; padding-left: 4px; }
.board { height: 13px; margin: 0 -25px; background: linear-gradient(#d7dbdd,#b6bbbf); box-shadow: 0 7px 8px -5px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.7); position: relative; }
.tag { position: absolute; left: 25px; top: 2px; font: 500 9px/9px var(--caps); letter-spacing: .14em; text-transform: uppercase; color: #5b6064; background: #f4f5f5; padding: 0 7px; border: 1px solid #aeb5ba; white-space: nowrap; }
.grp { display: flex; align-items: flex-end; position: relative; } .grp.sep { margin-left: 26px; } .grp.sep::before { content: ""; position: absolute; left: -15px; bottom: 0; width: 3px; height: 44px; background: #9aa0a4; opacity: .5; }
.grp .tag { white-space: nowrap; left: 0; top: calc(100% + 2px); z-index: 5; }
.tag i { font-style: normal; opacity: .5; padding: 0 3px; }

/* simpleshelf book */
.ss-book { flex: none; position: relative; cursor: pointer; perspective: 800px; perspective-origin: 50% 100%; z-index: 1; }
.ss-book:hover, .ss-book.open { z-index: 100; }
.ss-book { transition: transform .2s ease; } .ss-book.open { transform: translateY(-18px); }
.ss-3d { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform .3s ease; transform: rotateY(-25deg) rotateZ(var(--tilt,0deg)); transform-origin: center bottom; }
.ss-book:hover .ss-3d, .ss-book.open .ss-3d { transform: rotateY(-55deg) rotateX(-8deg) rotateZ(0deg); }
.ss-spine { position: absolute; inset: 0; border-radius: 2px; display: flex; justify-content: center; align-items: flex-start; gap: 4px; padding: 11px 2px 10px; backface-visibility: hidden; overflow: hidden;}
.ss-title, .ss-au { writing-mode: vertical-rl; white-space: nowrap; }
.ss-title { font: 600 11.5px/1.2 var(--book); letter-spacing: .02em; }
.ss-au { font: 400 9.5px/1.2 var(--book); opacity: .68; letter-spacing: .03em; }
/* an output collection: black cloth hardcover, muted spine, foil lettering */
.ss-spine.out { align-items: center; color: #e4d8b8; }
.ss-spine.out::before, .ss-spine.out::after { content: ""; position: absolute; left: 3px; right: 3px; height: 3px; border-top: 1px solid #e4d8b8; border-bottom: 1px solid #e4d8b8; opacity: .45; }
.ss-spine.out::before { top: 9px; } .ss-spine.out::after { bottom: 9px; }
.ss-spine.out .ss-title { font-weight: 500; letter-spacing: .06em; }
.ss-cover { position: absolute; top: 0; left: 100%; height: 100%; aspect-ratio: 170 / 240; background-size: cover; background-position: center; border: 1px solid; box-sizing: border-box; transform-origin: left center; transform: rotateY(90deg); backface-visibility: hidden; }
.ss-rib { position: absolute; top: 0; left: 50%; margin-left: -3px; width: 6px; height: 15px; background: #a43b3b; clip-path: polygon(0 0,100% 0,100% 100%,50% 70%,0 100%); }

/* drawer: a collection's notes, pulled out under its shelf */
.drawer { position: absolute; left: var(--dl, 0); top: 100%; width: 330px; z-index: 400; padding: 12px 16px 14px; background: #e0e4e7; }
.drawer h4 { margin: 0 0 8px; font: 400 15px/1.3 var(--book); }
.drawer h4 a { display: inline-block; padding: 1px 6px; margin-left: -6px; color: var(--ink); cursor: pointer; }
.drawer h4 a:hover { background: #232527; color: #fff; }
.drawer ul { list-style: none; margin: 0; padding: 0; columns: 1; }
.drawer li { display: flex; gap: 10px; padding: 1px 0; font: 13px/1.45 var(--book); break-inside: avoid; cursor: pointer; }
.drawer li:hover span.t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.drawer li .d { font: 11px/1.9 var(--ui); color: var(--muted); width: 46px; flex: none; }
.drawer li.un { color: var(--muted); font-style: italic; cursor: default; } .drawer li.un:hover span.t { text-decoration: none; }

/* loose leaves tray */
.toast { position: fixed; left: 50%; bottom: 62px; transform: translateX(-50%) translateY(8px); background: #232527; color: #f1f3f4; padding: 3px 12px; border-radius: 999px; font: 11px var(--ui); letter-spacing: .02em; opacity: 0; transition: .15s; pointer-events: none; z-index: 10000; white-space: nowrap; }

/* ---- the existing settings page, with the new folder role ---- */
.sheet-wrap { position: fixed; inset: 0; z-index: 150; background: rgba(35,37,39,.45); display: none; overflow: auto; padding: 40px 20px; } .sheet-wrap.on { display: block; }
.sheet { max-width: 820px; margin: 0 auto; background: var(--index-bg); border: 1px solid #c4c9cc; box-shadow: 0 20px 60px rgba(0,0,0,.35); padding: 26px 34px 34px; font: 15px/1.5 var(--serif); }
.sheet .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; } .sheet .top h1 { font: 600 20px var(--serif); margin: 0; }
.sheet .top button { border: 0; background: none; font-size: 22px; color: var(--muted); }
.sheet .layout { display: flex; gap: 28px; align-items: flex-start; }
.sheet nav { flex: 0 0 130px; display: flex; flex-direction: column; gap: 2px; } .sheet nav span { padding: 7px 12px; border-radius: 5px; color: var(--muted); } .sheet nav span.on { background: #fbfbfa; color: var(--ink); font-weight: 600; box-shadow: inset 0 0 0 1px #d5d9dc; }
.sheet .form { flex: 1; min-width: 0; } .sheet h2 { font: 600 17px var(--serif); margin: 0 0 4px; }
.sheet .hint { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.sheet .segmented { display: inline-flex; padding: 3px; margin-bottom: 14px; background: #e0e4e7; border-radius: 7px; gap: 2px; }
.sheet .segmented button { border: 0; background: none; font-size: 14px; min-width: 92px; padding: 5px 16px; border-radius: 5px; color: var(--muted); } .sheet .segmented button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.12); }
.sheet .choices { display: flex; gap: 18px; font-size: 14px; margin-bottom: 8px; }
.sheet .list { padding: 6px 10px; border: 1px solid #d5d9dc; border-radius: 4px; background: #fff; }
.sheet .frow { display: flex; align-items: center; gap: 8px; padding: 4px 0; font-size: 14px;  } .sheet .frow:last-child { border: 0; }
.sheet .frow .c { color: var(--muted); font-size: 12px; } .sheet .frow .sp { flex: 1; }
.sheet .frow .role { display: inline-flex; border: 1px solid #d5d9dc; border-radius: 5px; overflow: hidden; }
.sheet .frow .role button { border: 0; background: #fff; font-size: 12.5px; padding: 1px 12px; color: var(--muted); } .sheet .frow .role button + button { border-left: 1px solid #d5d9dc; } .sheet .frow .role button.on { background: #232527; color: #f1f3f4; }
.sheet .frow .inh { font: italic 12px var(--serif); color: var(--muted); }
.sheet .callout { margin-top: 10px; font-size: 12.5px; color: var(--muted); font-style: italic; }
.sheet .new { font: 500 9px var(--caps); letter-spacing: .14em; text-transform: uppercase; background: #a43b3b; color: #fff; padding: 1px 6px; border-radius: 3px; margin-left: 8px; vertical-align: 2px; }

@media (max-width: 860px) { .drawer ul { columns: 1; } .sheet .layout { flex-direction: column; } .chips { margin-left: 0; } }

/* segmented control (same as the settings page's) */
.seg { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 9999; display: flex; align-items: stretch; background: #f6f8f9; border: 1px solid #232527; border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: none; font: 500 10.5px var(--ui); letter-spacing: .12em; text-transform: uppercase; padding: 6px 16px; color: #232527; cursor: pointer; }
.seg button + button { border-left: 1px solid #232527; }
.seg button.on { color: #fff; background: #232527; }
.zone-head { display: flex; align-items: center; justify-content: space-between; }

/* ---- shelf style B: no bookcase, one line + the necessary dividers ---- */
.line .frame { background: none; border: 0; box-shadow: none; padding: 4px 0 0; }
.line .board { margin: 0; height: 1px; background: var(--line); box-shadow: none; }
.line .tag { left: 0; top: calc(100% + 7px); background: none; border: 0; padding: 0; color: var(--muted); font-size: 10px; }
.line .grp .tag { top: calc(100% + 8px); }
.line .grp.sep { margin-left: 40px; } .line .grp.sep::before { width: 1px; height: 50%; bottom: 0; left: -22px; background: var(--line); opacity: 1; z-index: 300; }
.line .shelf { padding-bottom: 22px; }


/* ---- loose leaves: flat, in the same line language as the shelves ---- */
.lv-list { columns: 3 300px; column-gap: 44px; }
.lv-list .it { display: flex; align-items: baseline; gap: 10px; padding: 2px 6px; margin: 0 -6px; break-inside: avoid; cursor: pointer; font: 14px/1.5 var(--book); }
.lv-list .it .d, .lv-sheets .d { font: 500 10px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); width: 50px; flex: none; }
.lv-list .it .c { margin-left: auto; font: 10.5px var(--ui); color: var(--muted); }
.lv-list .it:hover { background: #232527; color: #fff; } .lv-list .it:hover .d, .lv-list .it:hover .c { color: #b9c0c5; }
.ic { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex: none; }

/* header tools: outlined like the bottom capsule */
.tools { display: flex; align-items: center; gap: 10px; position: relative; }
.sbox { display: flex; align-items: center; height: 32px; border: 1px solid #232527; border-radius: 999px; overflow: hidden; }
.sbox input { width: 0; padding: 0; border: 0; outline: 0; background: none; font: 13px var(--ui); color: #232527; transition: width .2s, padding .2s; }
.sbox.open input { width: 230px; padding: 0 4px 0 14px; }
.ib { width: 30px; height: 30px; border: 0; background: none; color: #232527; display: grid; place-items: center; cursor: pointer; border-radius: 50%; }
.ib:hover { background: #232527; color: #fff; }
.gearb { width: 32px; height: 32px; border: 1px solid #232527; }
.sr { position: absolute; right: 42px; top: 40px; width: 440px; max-height: 60vh; overflow: auto; background: #f6f8f9; border: 1px solid #232527; z-index: 500; display: none; padding: 6px 0; }
.sr.on { display: block; }
.sr h6 { margin: 8px 12px 2px; font: 500 10px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.sr .it { display: flex; align-items: baseline; gap: 10px; padding: 3px 12px; font: 13.5px/1.4 var(--book); cursor: pointer; }
.sr .it:hover { background: #232527; color: #fff; } .sr .it:hover .d, .sr .it:hover .c { color: #b9c0c5; }
.sr .d { font: 500 10px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 74px; flex: none; }
.sr .c { margin-left: auto; font: 10.5px var(--ui); color: var(--muted); white-space: nowrap; }
.sr mark { background: none; color: inherit; text-decoration: underline; text-underline-offset: 2px; }
.sr .none { padding: 10px 12px; font: 12.5px var(--ui); color: var(--muted); }
.ic.s { width: 12px; height: 12px; stroke-width: 2; vertical-align: -1px; margin-left: 3px; }
.alllink { font: 500 11px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); cursor: pointer; text-decoration: none; } .alllink:hover { color: #232527; }
.allhead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 14px; }
.allhead h2 { margin: 0; font: 500 12px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
.month { margin: 26px 0 6px; font: 500 10.5px var(--ui); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
/* a collection's notes, next to its book */
.drawer { padding: 0; width: 244px; border: 1px solid #232527; background: #f6f8f9; }
.dh { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 2px 10px; border-bottom: 1px solid #232527; font: 400 13px/1.3 var(--book); color: #232527; cursor: pointer; }
.dh:hover { background: #232527; color: #fff; }
.dlw { padding: 4px 7px 5px 10px; }
.dl { max-height: 150px; overflow-y: auto; padding-right: 9px; overscroll-behavior: contain; }
.drawer li .d { font: 500 10px var(--ui); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); width: 66px; flex: none; }
.drawer li:hover .d { color: var(--muted); }
.dl::-webkit-scrollbar { width: 4px; } .dl::-webkit-scrollbar-thumb { background: var(--line); }
.drawer ul { margin: 0; padding: 0; list-style: none; columns: 1; }
.drawer li { display: flex; align-items: baseline; gap: 8px; padding: 2px 0; font: 12.5px/1.35 var(--book); cursor: pointer; }
.drawer li:hover span.t { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.back { display: inline-flex; align-items: center; gap: 8px; font: 500 11px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: #232527; cursor: pointer; padding: 6px 8px 6px 0; } .back:hover { text-decoration: underline; text-underline-offset: 4px; }
</style>
</head>
<body>
<div class="proto-bar"><b>Dashboard v10</b><span class="sp"></span><span>mock vault — nothing here reads your files</span></div>
<div class="home" id="app"></div>
<div class="toast" id="toast"></div>
<div class="sheet-wrap" id="sheet"></div>

<script>
/* ============ mock vault ============ */
const PAL = [ ["#2f3d4f","#e8ebee"],["#6b2f33","#f0e3e0"],["#b9a67c","#2a2418"],["#4d5a4a","#e9ede6"],["#d9d3c3","#2b2b2b"],["#2b2d30","#e6e6e6"],["#8a5a3c","#f5ebe0"],["#7d8a95","#14181b"],["#a69f93","#1f1d19"],["#3a4a45","#dce6e2"] ];
const hash = (s) => { let h = 7; for (const c of s) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };
const B = (title, author, fmt, words, prog = 0) => ({ kind: "book", title, author, fmt, words, prog, c: PAL[hash(title) % PAL.length] });
const V = (name, layout, notes, words, drafts, latest, titles = []) => ({ kind: "vol", name, title: name, layout, notes, words, drafts, latest, titles, c: [PAL[3], PAL[0], PAL[1], PAL[6], PAL[7], PAL[2]][hash(name) % 6] });
const N = (name, items = [], kids = []) => ({ name, items, kids });

const VAULT = [
  { name: "Books", input: N("Books", [], [
      N("Fiction", [ B("酒吧长谈","马里奥·巴尔加斯·略萨","epub",330000,.34), B("Pale Fire","Vladimir Nabokov","epub",70000,1), B("红楼梦","曹雪芹","epub",800000,.08), B("The Remains of the Day","Kazuo Ishiguro","epub",69000), B("Austerlitz","W. G. Sebald","epub",90000,.6), B("百年孤独","加西亚·马尔克斯","epub",140000,1), B("Giovanni's Room","James Baldwin","epub",60000), B("Invisible Cities","Italo Calvino","epub",40000,1), B("Ficciones","J. L. Borges","epub",52000) ]),
      N("Theory", [ B("Mythologies","Roland Barthes","epub",110000), B("Illuminations","Walter Benjamin","epub",100000,.22) ], [
        N("Photography", [ B("Camera Lucida","Roland Barthes","epub",35000,1), B("论摄影","苏珊·桑塔格","epub",90000,.5), B("Ways of Seeing","John Berger","epub",40000,1), B("On Photography","S. Sontag","pdf",92000) ]),
        N("Philosophy", [ B("The Poetics of Space","Gaston Bachelard","epub",85000) ], [
          N("Phenomenology", [ B("Being and Time","Heidegger","pdf",230000,.05), B("Phenomenology of Perception","Merleau-Ponty","pdf",210000), B("Ideas I","Husserl","pdf",180000) ]),
          N("Critical theory", [ B("Dialectic of Enlightenment","Adorno & Horkheimer","epub",120000), B("One-Dimensional Man","Marcuse","epub",95000) ]) ]) ]),
      N("Poetry", [ B("Duino Elegies","R. M. Rilke","epub",20000,.9), B("北岛诗选","北岛","epub",30000), B("Bluets","Maggie Nelson","epub",20000,1) ]) ]),
    output: null },
  { name: "Papers", input: N("Papers", [], [
      N("PhD · spatial computing", [ B("Embodied Interaction in AR","Dourish","pdf",12000,.7), B("Tangible Bits","Ishii & Ullmer","pdf",9000,1), B("Slow Technology","Hallnäs","pdf",8000), B("Material Speculation","Wakkary","pdf",15000,.2), B("Soma Design","Höök","pdf",11000), B("Reflective Design","Sengers","pdf",9500,1), B("Research through Design","Zimmerman","pdf",7000) ]),
      N("Reading group", [ B("Seeing Like a State (ch. 1–3)","J. C. Scott","pdf",34000,.4), B("Cyborg Manifesto","D. Haraway","pdf",28000,1), B("Staying with the Trouble","D. Haraway","pdf",95000) ]) ]),
    output: N("Papers", [ V("Papers · reading notes","paper",9,11500,2,"Oct 3, 2026",[["Oct 3","Dourish, on place"],["Sep 19","Haraway, the string figure"],["Sep 2","Draft: Soma design"]]) ]) },
  { name: "Magazines", input: N("Magazines", [ B("Apartamento 34","—","pdf",38000), B("Cabinet 71","—","pdf",31000,.3), B("The Gradient","—","pdf",26000), B("Kinfolk 52","—","pdf",22000,1), B("Pin-Up 31","—","pdf",44000) ]), output: null },
  { name: "Journal", input: null, output: N("Journal", [ V("Journal","zine",211,105000,0,"Oct 18, 2026",[["Oct 18","Tuesday"],["Oct 17","Monday, cold"],["Oct 16","Weekend"],["Oct 14","—"],["Oct 12","Nothing to report"],["Oct 11","Rain"]]) ], [ N("Archive", [ V("Journal 2025","zine",300,142000,0,"Dec 31, 2025"), V("Journal 2024","zine",280,131000,0,"Dec 31, 2024") ]) ]) },
  { name: "medaydreamalot", input: null, output: N("medaydreamalot", [ V("medaydreamalot","zine",48,58000,3,"Oct 14, 2026",[["Oct 14","Notes on waiting rooms"],["Oct 9","Rain, again"],["Sep 30","A tram in Lisbon"],["Sep 21","Draft: on handwriting"],["Sep 12","The bakery, the radio"],["Aug 28","Small hours"]]) ]) },

/* ============ helpers ============ */
const esc = (s) => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmtWords = (w) => w >= 1000 ? Math.round(w / 1000) + "k words" : w + " words";
// Thickness grows with the square root of the word count: a 5k-word paper is a
// slim booklet, an 800k-word novel a brick, and nothing is hairline or absurd.
// Thickness grows with the square root of the word count: a short paper is a
// slim booklet, an 800k-word novel a brick, and nothing is hairline or absurd.
const thickness = (w) => Math.max(26, Math.min(70, Math.round(12 + 0.085 * Math.sqrt(w))));
// Tall enough that the whole title and author show on the spine.
const run = (t, cjk, lat) => [...t].reduce((n, c) => n + (/[\u3000-\u9fff\uff00-\uffef]/.test(c) ? cjk : lat), 0);
const height = (b) => Math.min(300, Math.max(150 + Math.sqrt(b.words) * .05, run(b.title, 12.4, 6.6) + 30, run(b.author || "", 10, 5.3) + 30));
const ARROW = '<svg class="ic s" viewBox="0 0 24 24"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';
const toast = (m) => { const t = document.getElementById("toast"); t.innerHTML = ARROW + " " + esc(m); t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 1800); };

// Placeholder art. In the real thing an epub's cover is its own cover image,
// and a pdf's is its rendered first page; a collection is a black cloth cover.
function coverUri(b) {
  const vol = b.kind === "vol"; const [c, f] = vol ? ["#1b1c1d", "#e4d8b8"] : b.c; const x = vol ? 26 : 18;
  const t = b.title; const cjk = /[\u3400-\u9fff]/.test(t); const per = cjk ? 7 : 16; const lines = []; let cur = "";
  for (const w of (cjk ? [...t] : t.split(" "))) { const sep = cjk ? "" : " "; if ((cur + sep + w).length > per && cur) { lines.push(cur); cur = w; } else cur = cur ? cur + sep + w : w; }
  lines.push(cur);
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="170" height="240" viewBox="0 0 170 240"><rect width="170" height="240" fill="${c}"/>${vol ? `<rect x="8" y="8" width="154" height="224" fill="none" stroke="${f}" stroke-opacity=".35"/>` : ""}
    ${lines.map((l, i) => `<text x="${x}" y="${(vol ? 70 : 44) + i * 22}" font-family="Georgia,'Songti SC',serif" font-size="17" font-weight="600" fill="${f}">${esc(l)}</text>`).join("")}
    <text x="${x}" y="224" font-family="Georgia,serif" font-size="11" fill="${f}" opacity=".7">${esc(vol ? b.layout : b.author)}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg).replace(/'/g, "%27").replace(/\(/g, "%28").replace(/\)/g, "%29");
}

const SPINES = ["#3b4a57", "#5a3a3e", "#46533f", "#6b5b45", "#3f4a4e", "#554a5e", "#2f3b3a", "#4d4f58"];
function bookEl(b, id) {
  const w = thickness(b.words), h = Math.round(height(b)), tilt = 0, gap = 6 + hash(b.title + "g") % 7;
  const isVol = b.kind === "vol"; const [bg, fg] = isVol ? [SPINES[hash(b.title) % SPINES.length], "#e4d8b8"] : b.c;
  const inner = isVol
    ? `<span class="ss-title">${esc(b.title)}</span>`
    : `<span class="ss-title">${esc(b.title)}</span>${b.author && b.author !== "—" ? `<span class="ss-au">${esc(b.author)}</span>` : ""}${b.prog > 0 && b.prog < 1 ? `<i class="ss-rib"></i>` : ""}`;
  return `<div class="ss-book ${S.open === id ? "open" : ""}" data-id="${esc(id)}" style="width:${w}px;height:${h}px;margin-right:${gap}px;--tilt:${tilt}deg">
    <div class="ss-3d"><div class="ss-spine ${isVol ? "out" : ""}" style="background-color:${bg};color:${fg}">${inner}</div><div class="ss-cover" style="background-image:url(${coverUri(b)});border-color:${bg}"></div></div></div>`;
}

/* One shelf for every folder that directly holds books, however deep the
   folders go — each tagged with its path under the top-level folder (the case). */
function shelvesOf(node, path = [], out = []) {
  if (node.items.length) out.push({ path, items: node.items });
  node.kids.forEach(k => shelvesOf(k, [...path, k.name], out));
  return out;
}
const total = (shelves) => shelves.reduce((n, s) => n + s.items.length, 0);
function chunkRows(items, avail) {
  const rows = []; let row = [], used = 0;
  for (const b of items) { const w = thickness(b.words) + 14; if (used + w > avail && row.length) { rows.push(row); row = []; used = 0; } row.push(b); used += w; }
  if (row.length) rows.push(row); return rows;
}
const idOf = (b) => (b.kind === "vol" ? "v:" : "b:") + b.title;
const findVol = (id) => { let f; VAULT.forEach(g => g.output && shelvesOf(g.output).forEach(s => s.items.forEach(b => { if (idOf(b) === id) f = b; }))); return f; };

const COLOF = (v) => /^Journal/.test(v.title) ? "Journal" : /^Papers/.test(v.title) ? "Papers" : /^Ch\./.test(v.title) ? "medoresearch" : ["Japan", "Portugal", "Iceland"].includes(v.title) ? "Travel" : v.title;
function drawerHtml(v) {
  const col = COLOF(v), notes = ALL.filter(n => n.col === col);
  return `<div class="drawer"><a class="dh" data-go="${esc(v.title)}"><span>${esc(v.title)}</span>${ARROW}</a>
    <div class="dlw"><div class="dl"><ul>${notes.map(n => `<li data-note="${esc(n.title)}">${dbox(n.date, true)}<span class="t">${esc(n.title)}</span></li>`).join("")}</ul></div></div></div>`;
}

function caseHtml(name, node, avail) {
  const shelves = shelvesOf(node);
  if (!shelves.length) return "";
  const filter = S.filter[name]; const vis = filter ? shelves.filter(s => s.path.join("/").startsWith(filter)) : shelves;
  const chips = shelves.length > 1 ? (() => {
    const paths = new Set(); shelves.forEach(s => s.path.forEach((_, i) => paths.add(s.path.slice(0, i + 1).join("/"))));
    return `<span class="chips"><button class="chip ${!filter ? "on" : ""}" data-case="${esc(name)}" data-f="">All</button>${[...paths].map(p => { const d = p.split("/").length - 1; return `<button class="chip ${filter === p ? "on" : ""}" data-case="${esc(name)}" data-f="${esc(p)}">${esc(p.split("/").pop())}${d ? `<span class="d">${"›".repeat(d)}</span>` : ""}</button>`; }).join("")}</span>`; })() : "";
  const isOut = shelves[0].items[0].kind === "vol";
  // Sibling shelves share boards: each folder's books form a group, groups
  // are separated by a bookend and labelled with their path on the board.
  const groups = vis.flatMap(s => chunkRows(s.items, avail).map((c, i) => ({ path: s.path, items: c, label: i === 0 })));
  // A single book already says what it is; every other group is labelled by
  // its path, and is at least as wide as that label so it never truncates.
  groups.forEach(g => { const last = g.path.length ? g.path[g.path.length - 1] : name; g.lab = g.label && (g.path.length || shelves.length > 1) ? (g.path.length ? g.path.slice(-2).join(" › ") : name) : ""; g.lw = g.lab ? Math.ceil(g.lab.length * 8 + 6) : 0; });
  const gw = (g) => Math.max(g.lw, g.items.reduce((n, b) => n + thickness(b.words) + 14, 0));
  const rows = []; let cur = [], used = 0;
  groups.forEach(g => { const w = gw(g) + (cur.length ? 44 : 0); if (used + w > avail && cur.length) { rows.push(cur); cur = []; used = 0; } cur.push(g); used += w + (cur.length > 1 ? 0 : 0); });
  if (cur.length) rows.push(cur);
  const frameW = Math.max(...rows.map(r => r.reduce((n, g) => n + gw(g), 0) + 44 * (r.length - 1))) + 40;
  const rowsHtml = rows.map(row => {
    const open = row.flatMap(g => g.items).find(b => S.open === idOf(b));
    return `<div class="shelf"><div class="row">${row.map((g, gi) => `<div class="grp ${gi ? "sep" : ""}" style="min-width:${g.lw}px">${g.items.map(b => bookEl(b, idOf(b))).join("")}${g.lab ? `<span class="tag">${esc(g.lab).replace(/ › /g, "<i>›</i>")}</span>` : ""}</div>`).join("")}</div><div class="board"></div>${open && open.kind === "vol" ? drawerHtml(open) : ""}</div>`;
  }).join("");
  return `<div class="case"><div class="case-head"><h3>${esc(name)}</h3>${chips}</div><div class="frame" style="width:${frameW}px;max-width:100%">${rowsHtml}<div style="height:12px"></div></div></div>`;
}

/* ============ page ============ */
function render() {
  const app = document.getElementById("app");
  const avail = Math.min(1120, window.innerWidth - 48) - 58;
  // A folder with a single small shelf doesn't get a bookcase of its own:
  // those share one ("Folders"), each tagged with its name.
  const cases = (key, role) => {
    const nodes = VAULT.filter(g => g[key] && S.roles[g.name] === role).map(g => g[key]);
    const small = (n) => total(shelvesOf(n)) <= 6;
    const big = nodes.filter(n => !small(n)), few = nodes.filter(small);
    return big.map(n => caseHtml(n.name, n, avail)).join("") + (few.length ? caseHtml("Folders", N("Folders", [], few), avail) : "");
  };
  const inCases = cases("input", "input"), outCases = cases("output", "output");
  const hasIn = !!inCases, hasOut = !!outCases;
  if (!hasIn) S.tab = "writing";
  app.className = "home line";
  requestAnimationFrame(() => { const d = app.querySelector(".drawer"), bk = app.querySelector(".ss-book.open"); if (d && bk) { const sh = d.parentElement.getBoundingClientRect(); d.style.setProperty("--dl", Math.max(0, Math.min(bk.getBoundingClientRect().left - sh.left, sh.width - 244)) + "px"); } });
  const BACK = `<a class="back" data-back><svg class="ic" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>Back</a>`;
  const header = `<header class="top">${S.view === "all" ? BACK : `<div class="brand">Roaming2026</div>`}<div class="tools">
    <div class="sbox ${S.q || S.sopen ? "open" : ""}"><input id="q" type="text" placeholder="Search notes and books" autocomplete="off" value="${esc(S.q)}" /><button class="ib" data-search aria-label="Search"><svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></button></div>
    <button class="ib gearb" data-open-settings aria-label="Settings"><svg class="ic" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    <div class="sr" id="sr"></div></div></header>`;
  if (S.view === "all") {
    const cols = [...new Set(ALL.map(n => n.col || "unfiled"))];
    const list = ALL.filter(n => !S.allf || (n.col || "unfiled") === S.allf);
    let last = "";
    const body = list.map(n => { const m = MON[n.date.getMonth()] + " " + n.date.getFullYear(); const head = m !== last ? `<div class="month">${m}</div>` : ""; last = m;
      return head + `<div class="it" data-note="${esc(n.title)}">${dbox(n.date)}<span>${esc(n.title)}</span><span class="c">${n.col ? esc(n.col) : "unfiled"}</span></div>`; }).join("");
    app.className = "home line";
    app.innerHTML = header + `<div class="chips" style="margin:0 0 6px"><button class="chip ${!S.allf ? "on" : ""}" data-allf="">All</button>${cols.map(c => `<button class="chip ${S.allf === c ? "on" : ""}" data-allf="${esc(c)}">${esc(c)}</button>`).join("")}</div>
      <div class="lv-list" style="columns:2 360px">${body}</div>`;
    updateSR(); return;
  }
  app.innerHTML = header + `
  <div class="seg">${hasIn ? `<button data-tab="library" class="${S.tab === "library" ? "on" : ""}">Library</button>` : ""}${hasOut ? `<button data-tab="writing" class="${S.tab === "writing" ? "on" : ""}">Writing</button>` : ""}</div>
  ${hasIn ? `<section class="zone" id="sec-library"><h2 class="kicker">Library</h2>${inCases}</section>` : ""}
  ${hasOut ? `<section class="zone" id="sec-writing"><h2 class="kicker">Writing</h2>${outCases}
    <div class="zone-head" style="margin-top:56px"><h2 class="kicker" style="margin:0">Loose leaves</h2><a class="alllink" data-all>All notes ${ARROW}</a></div><div style="height:22px"></div>${leavesHtml(avail)}</section>` : ""}`;
  updateSR();
}

// Search: notes anywhere in the vault (however old) and books, in a panel under the search box.
function updateSR() {
  const sr = document.getElementById("sr"); if (!sr) return;
  const q = S.q.trim().toLowerCase();
  if (!q) { sr.classList.remove("on"); return; }
  const hi = (t) => { const i = t.toLowerCase().indexOf(q); return i < 0 ? esc(t) : esc(t.slice(0, i)) + "<mark>" + esc(t.slice(i, i + q.length)) + "</mark>" + esc(t.slice(i + q.length)); };
  const notes = ALL.filter(n => n.title.toLowerCase().includes(q)).slice(0, 8);
  const books = BOOKS_FLAT().filter(b => (b.title + " " + b.author).toLowerCase().includes(q)).slice(0, 5);
  sr.innerHTML = (notes.length ? `<h6>Notes</h6>` + notes.map(n => `<div class="it" data-note="${esc(n.title)}">${dbox(n.date, true)}<span>${hi(n.title)}</span><span class="c">${n.col ? esc(n.col) : "unfiled"}</span></div>`).join("") : "")
    + (books.length ? `<h6>Books</h6>` + books.map(b => `<div class="it" data-id="b:${esc(b.title)}"><span class="d">${b.fmt}</span><span>${hi(b.title)}</span><span class="c">${esc(b.author)}</span></div>`).join("") : "")
    || `<div class="none">Nothing matches “${esc(S.q)}”.</div>`;
  sr.classList.add("on");
}

function leavesHtml(avail) {
  const nm = (l) => l[2] ? esc(l[2]) : "unfiled";
  return `<div class="lv-list">${LOOSE.map(l => `<div class="it" data-note="${esc(l[1])}">${dbox(l[0])}<span>${esc(l[1])}</span><span class="c">${nm(l)}</span></div>`).join("")}</div>`;
}

/* ============ events ============ */
document.addEventListener("input", (e) => { if (e.target.id === "q") { S.q = e.target.value; updateSR(); } });
document.addEventListener("keydown", (e) => { if (e.target.id === "q" && e.key === "Escape") { S.q = ""; S.sopen = false; render(); } });
document.addEventListener("click", (e) => {
  const t = e.target;
  if (t.closest("[data-search]")) { const b = t.closest(".sbox"); S.sopen = !b.classList.contains("open") || !!S.q; if (!S.sopen) S.q = ""; render(); if (S.sopen) document.getElementById("q").focus(); return; }
  if (S.q && !t.closest(".sr, .sbox")) { S.q = ""; S.sopen = false; render(); }
  if (S.open && !t.closest(".drawer, .ss-book")) { S.open = null; render(); }
  const tb = t.closest("[data-tab]"); if (tb) { const sec = document.getElementById("sec-" + tb.dataset.tab); if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - 16, behavior: "smooth" }); return; }
  const pp = t.closest("[data-p]"); if (pp) { const [k, v] = pp.dataset.p.split(":"); S[k] = v; document.querySelectorAll("[data-p^='" + k + ":']").forEach(x => x.setAttribute("aria-pressed", x === pp)); render(); return; }
  if (t.closest("[data-open-settings]")) { const s = document.getElementById("sheet"); s.innerHTML = settingsHtml(); s.classList.add("on"); return; }
  if (t.closest("[data-close-settings]") || t.id === "sheet") { document.getElementById("sheet").classList.remove("on"); render(); return; }
  const r = t.closest("[data-role]"); if (r) { const [n, v] = r.dataset.role.split(":"); S.roles[n] = v; document.getElementById("sheet").innerHTML = settingsHtml(); return; }
  const c = t.closest("[data-case]"); if (c) { S.filter[c.dataset.case] = c.dataset.f || null; render(); return; }
  if (t.closest("[data-close]")) { S.open = null; render(); return; }
  const go = t.closest("[data-go]"); if (go) { toast("/contents/" + go.dataset.go); return; }
  const n = t.closest("[data-note]"); if (n && !n.classList.contains("un")) { toast("/entry/" + n.dataset.note); return; }
  if (t.closest("[data-all]")) { e.preventDefault(); S.view = "all"; S.q = ""; render(); window.scrollTo(0, 0); return; }
  if (t.closest("[data-back]")) { S.view = "home"; render(); return; }
  const af = t.closest("[data-allf]"); if (af) { S.allf = af.dataset.allf || null; render(); return; }
  const bi = t.closest(".sr [data-id]"); if (bi) { toast("/epub/" + bi.dataset.id.slice(2)); return; }
  const bk = t.closest(".ss-book"); if (bk) { const id = bk.dataset.id;
    if (id.startsWith("v:")) { if (S.open === id) toast("/contents/" + id.slice(2)); else { S.open = id; render(); } }
    else toast("/epub/" + id.slice(2)); }
});
// The segments are anchors to stacked sections; the one in view is highlighted.
window.addEventListener("scroll", () => {
  if (S.view !== "home") return;
  const secs = ["library", "writing"].map(k => document.getElementById("sec-" + k)).filter(Boolean); if (!secs.length) return;
  let cur = secs[0].id.slice(4);
  secs.forEach(x => { if (x.getBoundingClientRect().top <= innerHeight * .45) cur = x.id.slice(4); });
  if (innerHeight + scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1].id.slice(4);
  if (cur !== S.tab) { S.tab = cur; document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.tab === cur)); }
}, { passive: true });
let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(render, 150); });
render();
</script>
