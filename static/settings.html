<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>md2book settings</title>
  <style>
    :root {
      --bg: #eceff1;
      --paper: #f6f8f9;
      --ink: #232527;
      --muted: #72777b;
      --rule: #c9cfd3;
      --accent: #232527;
      --serif: "iA Writer Quattro V", "Sarasa Mono HC", "Sarasa Fixed SC", ui-sans-serif, system-ui, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.55 var(--serif);
    }

    .layout {
      display: flex;
      align-items: flex-start;
      gap: 28px;
    }

    nav {
      position: sticky;
      top: 24px;
      flex: 0 0 76px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    nav button {
      border: 0;
      background: none;
      text-align: left;
      font: inherit;
      font-size: 12.5px;
      letter-spacing: .04em;
      padding: 4px 10px;
      border-radius: 999px;
      color: var(--muted);
      cursor: pointer;
    }

    nav button:hover { color: var(--ink); }

    nav button[aria-current="true"] {
      background: var(--ink);
      color: #fff;
    }

    #form {
      flex: 1;
      min-width: 0;
    }

    /* The tabs go above the form on a narrow screen; inside the panel
       floating over the home page they keep to its left until it's tiny. */
    @media (max-width: 700px) {
      html:not(.embedded) .layout { flex-direction: column; gap: 14px; }
      html:not(.embedded) nav { position: static; flex: none; flex-direction: row; flex-wrap: wrap; }
    }
    @media (max-width: 460px) {
      .embedded .layout { flex-direction: column; gap: 14px; }
      .embedded nav { position: static; flex: none; flex-direction: row; flex-wrap: wrap; }
    }
    .embedded main { padding-top: 52px; }

    main {
      max-width: 1120px;
      margin: 0 auto;
      padding: 40px 20px 120px;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      margin-bottom: 8px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      font-weight: 600;
    }

    .lang {
      margin-left: auto;
      display: flex;
      border: 1px solid var(--rule);
      border-radius: 999px;
      overflow: hidden;
    }

    .lang button {
      border: 0;
      background: none;
      font: inherit;
      font-size: 13px;
      padding: 3px 12px;
      cursor: pointer;
      color: var(--muted);
    }

    .lang button[aria-pressed="true"] {
      background: var(--ink);
      color: #fff;
    }

    /* The browser version (see useBrowserMode): no notes folder, no
       home page address. */
    .browser-mode .meta > span:first-child,
    .browser-mode .field:has(#f-site-homePath) { display: none; }

    /* A deployed site (see useRepoMode): its home page address is where
       this page is, and no folder to switch to. */
    .repo-mode .meta [data-t="notesHint"],
    .repo-mode .field:has(#f-site-homePath) { display: none; }

    .meta {
      color: var(--muted);
      font-size: 13px;
      margin: 0 0 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 4px 16px;
    }

    .meta code {
      font-size: 12px;
      word-break: break-all;
    }

    .status { margin-left: auto; }
    .status.error { color: #b22222; }

    .conflicts {
      color: #b22222;
      font-size: 13px;
      margin: 10px 0 0;
      padding-left: 18px;
    }

    section {
      background: var(--paper);
      border: 1px solid var(--rule);
      border-radius: 6px;
      padding: 20px 22px 8px;
      margin-bottom: 18px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 18px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 18px;
    }

    .field > label.title,
    .field > .title {
      display: block;
      font-weight: 600;
      font-size: 14px;
      margin-bottom: 4px;
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      margin: 2px 0 6px;
    }

    input[type="text"] {
      width: 100%;
      max-width: 420px;
      font: inherit;
      font-size: 14px;
      padding: 6px 9px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
    }

    input[type="text"]:focus {
      outline: 2px solid rgba(35, 37, 39, .25);
      border-color: var(--ink);
    }

    .effect .strength {
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 420px;
      margin-top: 8px;
      color: var(--muted);
      font-size: 13px;
    }

    .effect .strength input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
    }

    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 18px;
    }

    .choices label,
    .check {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    input[type="radio"],
    input[type="checkbox"] {
      accent-color: var(--accent);
      margin: 0;
    }

    .list {
      margin: 8px 0 4px;
      padding: 8px 10px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: #fff;
      max-height: 260px;
      overflow: auto;
    }

    .list .check {
      display: flex;
      padding: 2px 0;
    }

    .count {
      color: var(--muted);
      font-size: 12px;
      margin-left: 4px;
    }

    .empty {
      color: var(--muted);
      font-size: 13px;
      font-style: italic;
    }

    .tagfield {
      border-top: 1px solid var(--rule);
      padding: 8px 0 6px;
    }

    .tagfield:first-of-type { border-top: 0; }

    .tagfield .sub {
      margin: 6px 0 0 24px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 5px 0;
      border-bottom: 1px solid var(--rule);
      font-size: 14px;
    }

    .row:last-child { border-bottom: 0; }

    .row .choices { flex-wrap: nowrap; }

    .row .rule-note {
      color: var(--muted);
      font-size: 12px;
    }

    .table-wrap {
      overflow-x: auto;
      margin: 0 -6px 12px;
    }

    table.rules {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    table.rules th,
    table.rules td {
      padding: 6px 3px;
      border-bottom: 1px solid var(--rule);
      text-align: center;
      vertical-align: middle;
      white-space: nowrap;
    }

    table.rules thead th {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--muted);
      white-space: normal;
      line-height: 1.2;
    }

    table.rules tbody th {
      text-align: left;
      font-weight: 600;
    }

    table.rules tbody th.default {
      font-style: italic;
    }

    table.rules tbody tr:nth-child(2) th,
    table.rules tbody tr:nth-child(2) td {
      border-bottom: 2px solid var(--rule);
    }

    table.rules select {
      font: inherit;
      font-size: 12.5px;
      padding: 2px 2px;
      border: 1px solid var(--rule);
      border-radius: 4px;
      background: #fff;
      color: var(--ink);
      max-width: 116px;
    }

    table.rules input[type="text"] {
      width: 64px;
      font-size: 12.5px;
      padding: 3px 5px;
    }

    table.rules .na { color: var(--muted); }

    /* Folders / Properties / #Tags: one control, three equal choices. */
    .segmented {
      display: inline-flex;
      padding: 3px;
      margin-bottom: 14px;
      background: #eceeef;
      border-radius: 7px;
      gap: 2px;
    }

    .segmented button {
      border: 0;
      background: none;
      font: inherit;
      font-size: 14px;
      min-width: 92px;
      padding: 5px 16px;
      border-radius: 5px;
      color: var(--muted);
      cursor: pointer;
    }

    .segmented button[aria-selected="true"] {
      background: #fff;
      color: var(--ink);
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(0, 0, 0, .12);
    }

    /* A title with an explanation on hover. */
    .tip {
      cursor: help;
      text-decoration: underline dotted rgba(114, 119, 123, .6);
      text-underline-offset: 3px;
    }

    .remove-rule {
      border: 0;
      background: none;
      font-size: 17px;
      line-height: 1;
      color: var(--muted);
      cursor: pointer;
      padding: 0 4px;
    }

    .remove-rule:hover { color: #b22222; }

    .add-rule {
      font: inherit;
      font-size: 14px;
      padding: 6px 12px;
      border: 1px solid var(--rule);
      border-radius: 5px;
      background: #fff;
      color: var(--ink);
      cursor: pointer;
    }

    .add-rule:disabled { color: var(--muted); cursor: default; }

    /* Floating over the home page (an iframe): no way back to the site, it's behind. */
    .embedded #open-site, .embedded .meta [data-t="notesHint"] { display: none; }

    /* A., B., C. rows of the collection rules */
    .title.abc { background: #dfe3e6; padding: 4px 10px; border-radius: 4px; margin-bottom: 8px; }

    /* Arrange: a pool of folders, and below it Input and Output side by side */
    .pool { display: flex; flex-wrap: wrap; gap: 6px; min-height: 40px; padding: 8px 10px; border: 1px dashed var(--ink); border-radius: 6px; margin-bottom: 14px; background: rgba(255, 255, 255, .5); }
    .fchip { display: inline-flex; align-items: baseline; padding: 3px 10px; border: 1px solid var(--ink); border-radius: 999px; background: #fff; cursor: grab; font-size: 13px; }
    .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
    .cols section { margin-bottom: 0; min-width: 0; background: none; border: 0; padding: 0; }
    @media (max-width: 560px) { .cols { grid-template-columns: 1fr; } }
    [data-zone].over { background: rgba(35, 37, 39, .1); }
    section.plain { background: none; border: 0; padding: 0; margin-bottom: 14px; }
    .fchip .sep { margin: 0 6px; color: var(--muted); }
    .fchip.lifted { opacity: .4; }
    .fchip.ghost { position: fixed; top: -100px; left: -100px; background: #fff; }
    .dropbox { border: 1px dashed var(--ink); border-radius: 6px; padding: 10px 12px 12px; min-height: 84px; background: rgba(255, 255, 255, .5); }
    .dropbox h2 { margin: 0 0 8px; font-size: 15px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .fchip .count { margin-left: 4px; }
    .fchip button { border: 0; background: none; color: var(--muted); font-size: 14px; line-height: 1; cursor: pointer; padding: 0 0 0 6px; }
    .fchip button:hover { color: var(--ink); }
    .drophint { color: var(--muted); font-size: 13px; padding: 6px 0; }
    .preview { margin-bottom: 12px; }
    .cardhead { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 13px; }
    .mini { display: flex; align-items: flex-end; gap: 2px; padding: 0 12px 0 8px; margin-top: 6px; border-bottom: 1px solid var(--ink); min-height: 12px; width: fit-content; min-width: 100px; max-width: 100%; }
    .mini i { width: 6px; border-radius: 1px 1px 0 0; }
    .mini .count { margin-left: 6px; }

    [hidden] { display: none !important; }

    a { color: inherit; }
  </style>
</head>

  <script>if (window.top !== window) document.documentElement.classList.add("embedded");</script>

    <header>

    <p class="meta">

        strong: "重",
        strength: "强度"

    };

    // Opened by the browser version (web/app.js), which reads a folder on
    // this computer and puts nothing online: no "publishing", no folder
    // name, none of the server's own options.
    const BROWSER_TEXT = {
      en: {
        navPublish: "Notes",
        openSite: "Back to reading →",
        site: "Home page",
        publishing: "Notes",
        publishWhich: "Which notes are shown",
        publishField: "Only notes that have this frontmatter field:",
        idField: "Fixed address field",
        idFieldHint: "A note with this frontmatter field keeps the same address in this browser when you rename or move it.",
        collectionsHint: "Several notes laid out one after another, as an output document. A note can be in more than one collection."
      },
      zh: {
        navPublish: "笔记",
        openSite: "返回阅读 →",
        site: "首页",
        publishing: "笔记",
        publishWhich: "显示哪些笔记",
        publishField: "只显示带有这个 frontmatter 字段的笔记：",
        idField: "固定地址字段",
        idFieldHint: "带有这个 frontmatter 字段的笔记，改名或移动后，在这个浏览器里的地址不变。",
        collectionsHint: "多篇笔记连排在一起，作为输出文档。一篇笔记可以属于多个合集。",
        tipPrivate: "正文里这个文字的二级标题，连同它之后的内容都不会显示。"
      }
    };

    function useBrowserMode() {
      Object.assign(TEXT.en, BROWSER_TEXT.en);
      Object.assign(TEXT.zh, BROWSER_TEXT.zh);
      document.documentElement.classList.add("browser-mode");
    }

    // Opened on a deployed site whose notes are in a GitHub repository
    // (see SETTINGS_MODE in server.js): saved as a commit to the repo's
    // md2book.settings.json, and which notes are published is the
    // notes' own business (publish: false), shown but not set here.
    const REPO_TEXT = {
      en: {
        notesIn: "Notes from",
        savedTo: "Saved to",
        openSite: "Back to the site →",
        publishRuleHint: "Set in each note's frontmatter."
      },
      zh: {
        notesIn: "笔记来自",
        savedTo: "保存到",
        openSite: "返回网站 →",
        publishRuleHint: "在每篇笔记的 frontmatter 里设置。"
      }
    };

    let repoMode = false;

    function useRepoMode() {
      Object.assign(TEXT.en, REPO_TEXT.en);
      Object.assign(TEXT.zh, REPO_TEXT.zh);
      document.documentElement.classList.add("repo-mode");
      repoMode = true;
    }

    // Next to this page: /api/settings, or <home path>/api/settings on a
    // deployed site. (The browser version answers /api/settings itself.)
    const API = /\/settings\/?$/.test(location.pathname) ? location.pathname.replace(/\/settings\/?$/, "/api/settings") : "/api/settings";

    let lang = "en";
    try { lang = localStorage.getItem("md2book-settings-lang") || (navigator.language.startsWith("zh") ? "zh" : "en"); } catch { /* storage unavailable */ }
    const t = key => TEXT[lang][key] ?? TEXT.en[key] ?? key;

    let defaults = null;
    let settings = null;   // defaults merged with the saved file
    let vault = null;

    const $ = (sel, root = document) => root.querySelector(sel);
    // A path in full — but floating over the home page, only its last part (the rest on hover).
    function showPath(el, value) {
      const text = String(value ?? "");
      el.textContent = window.top !== window ? text.split(/[\\/]/).filter(Boolean).pop() || text : text;
      el.title = text;
    }
    const esc = value => String(value ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

    function isObject(v) { return v && typeof v === "object" && !Array.isArray(v); }

    function merge(base, over) {
      const out = { ...base };
      for (const [k, v] of Object.entries(over || {})) out[k] = isObject(v) && isObject(base[k]) ? merge(base[k], v) : v;
      return out;
    }

    // Only what differs from the defaults is saved.
    function diff(value, base) {
      if (isObject(value) && isObject(base)) {
        const out = {};
        for (const [k, v] of Object.entries(value)) {
          if (k === "tags" && isObject(v)) {
            if (JSON.stringify(v) !== JSON.stringify(base[k])) out[k] = v;
            continue;
          }
          const d = diff(v, base[k]);
          if (d !== undefined) out[k] = d;
        }
        return Object.keys(out).length ? out : undefined;
      }
      return JSON.stringify(value) === JSON.stringify(base) ? undefined : value;
    }

    // --- saving ----------------------------------------------------------

    let saveTimer = null;
    // Set when a change alters which notes are published: the lists of
    // folders and tags are redrawn from the server's answer.
    let refreshLists = false;
    // Kept as a key (plus detail) so a language switch re-translates it.
    let status = null;
    function setStatus(key, detail = "", error = false) {
      status = { key, detail, error };
      showStatus();
    }
    function showStatus() {
      const el = $("#status");
      el.textContent = status ? t(status.key) + status.detail : "";
      el.classList.toggle("error", !!(status && status.error));
    }

    // Pairs of "apply to all" collections that share notes: a note opened
    // on its own can't follow both.
    function conflicts() {
      const same = (a, b) => String(a).toLowerCase() === String(b).toLowerCase();
      const forced = (settings.layouts.rules || []).filter(r => r.applyToAll).map(r => r.collection);
      const pairs = new Map();
      for (const note of (vault && vault.shared) || []) {
        const hits = forced.filter(name => note.collections.some(c => same(c, name)));
        for (let i = 0; i < hits.length; i++) {
          for (let j = i + 1; j < hits.length; j++) {
            const key = hits[i] + "\u0000" + hits[j];
            if (!pairs.has(key)) pairs.set(key, { a: hits[i], b: hits[j], notes: [] });
            pairs.get(key).notes.push(note.title);
          }
        }
      }
      return [...pairs.values()];
    }

    function showConflicts() {
      const list = $("#conflicts");
      if (!list) return;
      const found = conflicts();
      const quote = lang === "zh" ? n => `《${n}》` : n => `"${n}"`;
      list.innerHTML = found.map(({ a, b, notes }) => {
        const shown = notes.slice(0, 3).map(quote).join(lang === "zh" ? "、" : ", ") + (notes.length > 3 ? " …" : "");
        return `<li>${esc(t("conflict")(a, b, shown))}</li>`;
      }).join("");
      list.hidden = !found.length;
      return found.length > 0;
    }

    function scheduleSave(immediate = false) {
      clearTimeout(saveTimer);
      if (showConflicts()) {
        setStatus("notSaved", "", true);
        return;
      }
      setStatus("saving");
      // Each save on a deployed site is a commit: a run of changes makes
      // one.
      saveTimer = setTimeout(save, repoMode ? (immediate ? 800 : 1500) : immediate ? 0 : 450);
    }

    async function save() {
      try {
        const res = await fetch(API, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(diff(settings, defaults) || {})
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || res.status);
        vault = data.vault;
        showPath($("#file"), data.file);
        // Changed collections can make notes shared that weren't: list
        // the clash (later changes won't save until it's resolved).
        showConflicts();
        if (refreshLists) {
          refreshLists = false;
          const y = window.scrollY;
          render();
          window.scrollTo(0, y);
        }
        setStatus("saved");
      } catch (error) {
        setStatus("saveFailed", error.message, true);
      }
    }

    // --- form helpers ------------------------------------------------------

    function get(path) {
      return path.split(".").reduce((o, k) => (o == null ? o : o[k]), settings);
    }

    function set(path, value) {
      const keys = path.split(".");
      let o = settings;
      for (const k of keys.slice(0, -1)) o = o[k] ??= {};
      o[keys.at(-1)] = value;
    }

    function textField(path, labelKey, hintKey, { placeholder = "", empty = "" } = {}) {
      const id = "f-" + path.replace(/\./g, "-");
      return `<div class="field">
        <label class="title" for="${id}">${esc(t(labelKey))}</label>
        ${hintKey ? `<div class="hint">${esc(t(hintKey))}</div>` : ""}
        <input type="text" id="${id}" data-text="${path}" data-empty="${esc(empty)}" value="${esc(get(path) ?? "")}" placeholder="${esc(placeholder)}" />
      </div>`;
    }

    function checkField(path, labelKey) {
      return `<div class="field"><label class="check"><input type="checkbox" data-bool="${path}" ${get(path) ? "checked" : ""} /> ${esc(t(labelKey))}</label></div>`;
    }

    // A paper effect's strength, from 0 to 100 (its switch is a column
    // of the layout table).
    function effectField(strengthPath, labelKey, hintKey) {
      const id = "f-" + strengthPath.replace(/\./g, "-");
      return `<div class="field effect">
        <label class="title" for="${id}">${esc(t(labelKey))}</label>
        <div class="hint">${esc(t(hintKey))}</div>
        <div class="strength">
          <span>${esc(t("light"))}</span>
          <input type="range" id="${id}" min="0" max="100" step="1" data-range="${strengthPath}" value="${esc(get(strengthPath) ?? 50)}" aria-label="${esc(t(labelKey) + " · " + t("strength"))}" />
          <span>${esc(t("strong"))}</span>
        </div>
      </div>`;
    }

    function radios(name, options, current) {
      return `<div class="choices">${options.map(([value, labelKey]) =>
        `<label><input type="radio" name="${name}" value="${esc(value)}" ${String(current) === String(value) ? "checked" : ""} /> ${esc(t(labelKey))}</label>`
      ).join("")}</div>`;
    }

    function checklist(items, chosen, group, emptyKey) {
      if (!items.length) return `<div class="empty">${esc(t(emptyKey))}</div>`;
      const set = new Set((chosen || []).map(v => String(v).toLowerCase()));
      return `<div class="list">${items.map(item => {
        const depth = group === "folders" ? item.name.split("/").length - 1 : 0;
        return `<label class="check" style="padding-left:${depth * 18}px"><input type="checkbox" data-group="${esc(group)}" value="${esc(item.name)}" ${set.has(item.name.toLowerCase()) ? "checked" : ""} /> ${esc(depth ? item.name.split("/").at(-1) : item.name)}<span class="count">${esc(t("notes")(item.notes))}</span></label>`;
      }).join("")}</div>`;
    }

    // ---- Arrange: every top-level folder is input, output, or (left in the pool) ignored ----

    // Which top-level folder a path is in ("" at the top).
    const topOf = path => (path ? path.split("/")[0] : "");

    // The top-level folders, with their notes and their EPUB / PDF files.
    function topFolders() {
      const notes = new Map(vault.folders.filter(f => !f.name.includes("/")).map(f => [f.name, f.notes]));
      const files = new Map();
      for (const b of vault.books || []) {
        const top = topOf(b.folder);
        if (!top) continue;
        if (!files.has(top)) files.set(top, []);
        files.get(top).push(b);
      }
      return { names: [...new Set([...notes.keys(), ...files.keys()])].sort((x, y) => x.localeCompare(y)), notes, files };
    }

    // Where each one is now. Until a folder has been moved by hand it is
    // automatic (see collections.outputFolders in lib/config-core.js).
    function arrangement() {
      const { names, notes, files } = topFolders();
      const lower = list => new Set((list || []).map(f => String(f).toLowerCase()));
      const inputSet = lower(settings.collections.inputFolders);
      const explicit = Array.isArray(settings.collections.outputFolders);
      const outputSet = lower(settings.collections.outputFolders);
      const input = names.filter(n => inputSet.has(n.toLowerCase()) || (!explicit && !notes.has(n)));
      const output = names.filter(n => !input.includes(n) && (explicit ? outputSet.has(n.toLowerCase()) : notes.has(n)));
      return { input, output, pool: names.filter(n => !input.includes(n) && !output.includes(n)), notes, files };
    }

    function moveFolder(name, zone) {
      const a = arrangement();
      const input = a.input.filter(n => n !== name), output = a.output.filter(n => n !== name);
      if (zone === "input") input.push(name);
      if (zone === "output") output.push(name);
      settings.collections.inputFolders = input;
      settings.collections.outputFolders = output;
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
      scheduleSave(true);
    }

    const MINI_COLOURS = ["#2f3d4f", "#6b2f33", "#b9a67c", "#4d5a4a", "#8a5a3c", "#7d8a95", "#3a4a45", "#a69f93"];
    const miniHash = str => { let h = 7; for (const c of str) h = (h * 31 + c.codePointAt(0)) >>> 0; return h; };

    // A folder as a chip. In the pool it is just its name; once it is in Input
    // (the files it shelves: "4×epub&pdf", "2×pdf") or Output (its notes:
    // "5×md") it says how many of those there are.
    function folderChip(name, a, zone) {
      let count = "";
      if (zone === "input") {
        const list = a.files.get(name) || [];
        const epub = list.filter(b => b.fmt === "epub").length, pdf = list.length - epub;
        // A folder with no EPUB or PDF files puts nothing on the shelves: no count.
        count = list.length ? `${list.length}×${epub && pdf ? "epub&pdf" : epub ? "epub" : "pdf"}` : "";
      } else if (zone === "output") {
        count = `${a.notes.get(name) || 0}×md`;
      }
      return `<span class="fchip" draggable="true" data-folder="${esc(name)}">${esc(name)}${count ? `<span class="sep">|</span><span class="count">${esc(count)}</span>` : ""}${zone !== "pool" ? `<button type="button" data-unplace="${esc(name)}" title="${esc(t("putBack"))}" aria-label="${esc(t("putBack"))}">×</button>` : ""}</span>`;
    }

    // What an input folder puts on the Input shelves: its files as small spines.
    function shelfPreview(name, a) {
      const list = a.files.get(name) || [];
      const epub = list.filter(b => b.fmt === "epub").length, pdf = list.length - epub;
      const counts = [epub ? `${epub} EPUB` : "", pdf ? `${pdf} PDF` : ""].filter(Boolean).join(" · ");
      const spines = list.slice(0, 40).map(b => `<i style="height:${16 + miniHash(b.title) % 20}px;background:${MINI_COLOURS[miniHash(b.title + "c") % MINI_COLOURS.length]}"></i>`).join("");
      return `<div class="preview"><div class="cardhead"><span>${esc(name)}<span class="count">${esc(counts)}</span></span></div><div class="mini">${spines}${list.length > 40 ? `<span class="count">+${list.length - 40}</span>` : ""}</div></div>`;
    }

    // --- rendering -----------------------------------------------------------

    function render() {
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
      document.title = lang === "zh" ? "md2book 设置" : "md2book settings";
      document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
      document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
      showStatus();

      const s = settings;
      const folders = s.collections.folders;
      const inline = s.collections.inlineTags;
      const tags = s.collections.tags || {};
      const arr = arrangement();
      const outputTops = arr.output;
      const outputFolders = vault.folders.filter(f => outputTops.includes(topOf(f.name)));
      const topFolderNames = outputTops.filter(n => arr.notes.has(n));
      const folderPicked = folders === true ? topFolderNames : Array.isArray(folders) ? folders : [];
      const inlinePicked = inline === true || inline === "*" ? vault.inlineTags.map(v => v.name) : Array.isArray(inline) ? inline : [];
      const selectAll = (group, total, picked) => total ? `<label class="check selectall"><input type="checkbox" data-all="${esc(group)}" data-total="${total}" data-picked="${picked}" /> ${esc(t("selectAll"))}</label>` : "";
      const fieldsHtml = vault.fields.length ? vault.fields.map(field => {
        const rule = tags[field.name];
        const picked = rule === "*" || rule === true ? field.values.map(v => v.name) : Array.isArray(rule) ? rule : [];
        return `<div class="tagfield"><div class="hint" style="margin:8px 0 2px"><b>${esc(field.name)}</b></div>${checklist(field.values, picked, "tag:" + field.name, "noFields")}</div>`;
      }).join("") : `<div class="empty">${esc(t("noFields"))}</div>`;
      const tagTotal = vault.fields.reduce((n, f) => n + f.values.length, 0);
      const tagPicked = vault.fields.reduce((n, f) => { const r = tags[f.name]; return n + (r === "*" || r === true ? f.values.length : Array.isArray(r) ? r.length : 0); }, 0);

      $("#form").innerHTML = `
        <section data-pane="publish">
          <h2>${esc(t("site"))}</h2>
          ${textField("site.title", "title", "titleHint")}
          ${textField("site.browserTitle", "browserTitle", "browserTitleHint", { placeholder: s.site.title })}
          ${textField("site.author", "author", "authorHint")}
        </section>

        <section data-pane="publish">
          <h2>${esc(t("publishing"))}</h2>
          ${repoMode ? `<div class="field">
            <div>${s.publish.require ? `${esc(t("publishField"))} <code>${esc(s.publish.require)}</code>` : esc(t("publishAll"))}</div>
            <div class="hint">${esc(t("publishRuleHint"))}</div>
          </div>` : `<div class="field">
            <div class="choices" style="flex-direction:column;gap:6px">
              <label><input type="radio" name="publish" value="all" ${s.publish.require ? "" : "checked"} /> ${esc(t("publishAll"))}</label>
              <label><input type="radio" name="publish" value="field" ${s.publish.require ? "checked" : ""} /> ${esc(t("publishField"))}
                <input type="text" id="publish-field" style="width:160px" value="${esc(s.publish.require || "publishID")}" /></label>
            </div>
          </div>
          `}
        </section>

        <section data-pane="io" class="plain">
          <div class="hint" style="margin:0 0 8px">${esc(t("arrangeHint"))}</div>
          <div class="pool" data-zone="pool">${arr.pool.map(n => folderChip(n, arr, "pool")).join("") || `<span class="count">—</span>`}</div>
        </section>

        <div class="cols" data-pane="io">
          <section class="col">
            <div class="dropbox" data-zone="input">
              <h2>${esc(t("readingTitle"))}</h2>
              <div class="chips">${arr.input.map(n => folderChip(n, arr, "input")).join("") || `<span class="drophint">${esc(t("dropHere"))}</span>`}</div>
            </div>
            <div class="hint" style="margin:10px 0">${esc(t("readingHint"))}</div>
            ${arr.input.filter(n => (arr.files.get(n) || []).length).map(n => shelfPreview(n, arr)).join("")}
          </section>
          <section class="col">
            <div class="dropbox" data-zone="output">
              <h2>${esc(t("writingTitle"))}</h2>
              <div class="chips">${arr.output.map(n => folderChip(n, arr, "output")).join("") || `<span class="drophint">${esc(t("dropHere"))}</span>`}</div>
            </div>
            ${arr.output.length ? `
            <div class="hint" style="margin:14px 0">${esc(t("collectionsHint"))}</div>
            <div class="field">
              <span class="title abc">${esc(t("srcFolders"))}</span>
              <div class="hint">${esc(t("foldersHint"))}</div>
              ${selectAll("folders", outputFolders.length, folderPicked.length)}
              ${checklist(outputFolders, folderPicked, "folders", "noFolders")}
            </div>
            <div class="field">
              <span class="title abc">${esc(t("srcProperties"))}</span>
              <div class="hint">${esc(t("tagFieldsHint"))}</div>
              ${selectAll("tag:", tagTotal, tagPicked)}
              ${fieldsHtml}
            </div>
            <div class="field">
              <span class="title abc">${esc(t("srcInline"))}</span>
              <div class="hint">${esc(t("inlineHint"))}</div>
              ${selectAll("inline", vault.inlineTags.length, inlinePicked.length)}
              ${checklist(vault.inlineTags, inlinePicked, "inline", "noInline")}
            </div>` : ""}
          </section>
        </div>

        <section data-pane="layout">
          <h2>${esc(t("layouts"))}</h2>
          <div class="table-wrap"><table class="rules" id="rules"></table></div>
          <ul class="conflicts" id="conflicts" hidden></ul>
          <button type="button" class="add-rule" id="add-rule">${esc(t("addRule"))}</button>
        </section>

        <section data-pane="layout">
          <h2>${esc(t("text"))}</h2>
          ${checkField("typography.titleCase", "titleCase")}
          ${checkField("typography.bookTitleMarks", "bookTitles")}
          ${textField("typography.subtitleSeparators", "subtitleSeparators", "subtitleSeparatorsHint")}
          ${textField("fonts.adobeKit", "adobeKit", "adobeKitHint")}
        </section>

        <section data-pane="layout">
          <h2>${esc(t("paper"))}</h2>
          <div class="hint" style="margin-top:-8px;margin-bottom:14px">${esc(t("paperHint"))}</div>
          ${effectField("paper.showThroughStrength", "showThrough", "showThroughHint")}
          ${effectField("paper.letterpressStrength", "letterpress", "letterpressHint")}
          ${effectField("paper.inkBleedStrength", "inkBleed", "inkBleedHint")}
        </section>
      `;
      renderRules();
      syncSelectAll();
      showPane();
    }

    // --- navigation: Publishing / Layout ---------------------------------------

    const PANES = ["publish", "io", "layout"];
    let pane = PANES.includes(location.hash.slice(1)) ? location.hash.slice(1) : "publish";

    function showPane() {
      document.querySelectorAll("#form [data-pane]").forEach(section => { section.hidden = section.dataset.pane !== pane; });
      document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-current", String(b.dataset.pane === pane)));
    }

    document.querySelectorAll("nav button").forEach(button => button.addEventListener("click", () => {
      pane = button.dataset.pane;
      // Remembered in the address, where there is one: the browser
      // version shows this page in a srcdoc frame, which has none.
      try { history.replaceState(null, "", "#" + pane); } catch { /* no address to keep it in */ }
      showPane();
      window.scrollTo(0, 0);
    }));

    // --- the layout table: single notes, collections, then a row per rule ----

    // [setting, column title, its explanation (a tooltip on the title)]
    const COLUMNS = [
      ["layout", "colLayout", "tipLayout"], ["open", "colOpen", "tipOpen"], ["dropCap", "colDropCap", "tipDropCap"],
      ["justify", "colJustify", "tipJustify"], ["multiplyImages", "colMultiply", "tipMultiply"],
      ["pageNumbers", "colPageNumbers", "tipPageNumbers"], ["numberFigures", "colFigures", "tipFigures"],
      ["numberTables", "colTables", "tipTables"], ["numberHeadings", "colHeadings", "tipHeadings"],
      ["columns", "colColumns", "tipColumns"], ["dates", "colDates", "tipDates"], ["privateHeading", "colPrivate", "tipPrivate"],
      ["showThrough", "colShowThrough", "showThroughHint"], ["letterpress", "colLetterpress", "letterpressHint"],
      ["inkBleed", "colInkBleed", "inkBleedHint"],
      ["applyToAll", "colApplyToAll", "tipApplyToAll"]
    ];
    const tip = key => `class="tip" title="${esc(t(key))}"`;

    function select(key, value, options, disabled = false) {
      return `<select data-key="${key}" ${disabled ? "disabled" : ""}>${options.map(([v, label]) =>
        `<option value="${esc(v)}" ${String(v) === String(value) ? "selected" : ""}>${esc(label)}</option>`).join("")}</select>`;
    }

    function cell(key, row, isAll) {
      const v = row[key];
      switch (key) {
        case "layout": return select(key, v, [["paper", "Paper"], ["zine", "Zine"]]);
        case "open": return select(key, v, [["latest", t("openNewest")], ["first", t("openStart")]]);
        case "applyToAll": return isAll ? `<span class="na">—</span>` : `<input type="checkbox" data-key="${key}" ${v ? "checked" : ""} />`;
        case "columns": return select(key, v, [["1", "1"], ["2", "2"]]);
        case "dates": return select(key, v === "hide" ? "hide" : "show", [["show", t("datesShow")], ["hide", t("datesHide")]]);
        case "privateHeading": return `<input type="text" data-key="${key}" value="${esc(v || "")}" placeholder="${esc(t("none"))}" />`;
        default: return `<input type="checkbox" data-key="${key}" ${v ? "checked" : ""} />`;
      }
    }

    function collectionNames() {
      return vault.collections.map(c => c.name);
    }

    function renderRules() {
      const table = $("#rules");
      if (!table) return;
      const L = settings.layouts;
      L.rules ||= [];
      L.epub ||= {};
      const used = L.rules.map(r => String(r.collection).toLowerCase());
      const head = `<thead><tr><th>${esc(t("colCollection"))}</th>${COLUMNS.map(([, k, tipKey]) => `<th><span ${tip(tipKey)}>${esc(t(k))}</span></th>`).join("")}<th></th></tr></thead>`;
      const epubKeys = new Set(["dropCap", "justify", "multiplyImages", "pageNumbers", "columns", "numberFigures", "numberTables", "numberHeadings", "showThrough", "letterpress", "inkBleed"]);
      const tr = (label, row, id, isAll, extra = "") =>
        `<tr data-row="${id}">${label}${COLUMNS.map(([key]) => `<td>${id === "epub" && !epubKeys.has(key) ? `<span class="na">—</span>` : cell(key, row, isAll)}</td>`).join("")}<td>${extra}</td></tr>`;
      const rows = [
        tr(`<th scope="row" class="default"><span ${tip("tipCollection")}>${esc(t("rowCollection"))}</span></th>`, L.collection, "collection", true),
        ...L.rules.map((rule, i) => {
          const row = { ...L.collection, ...rule };
          const names = collectionNames();
          const options = [...new Set([rule.collection, ...names])]
            .filter(n => n === rule.collection || !used.includes(n.toLowerCase()))
            .map(n => [n, names.includes(n) ? n : `${n} ${t("notInNotes")}`]);
          return tr(`<th scope="row">${select("collection", rule.collection, options)}</th>`, row, i, false,
            `<button type="button" class="remove-rule" data-remove="${i}" title="${esc(t("removeRule"))}" aria-label="${esc(t("removeRule"))}">×</button>`);
        })
      ];
      if ((vault.epubs || []).length) rows.push(tr(`<th scope="row"><span class="tip" title="${esc(t("tipEpub"))}">EPUB</span></th>`,
        { ...L.collection, ...L.epub }, "epub", true));
      table.innerHTML = head + `<tbody>${rows.join("")}</tbody>`;
      showConflicts();
      const free = collectionNames().filter(n => !used.includes(n.toLowerCase()));
      $("#add-rule").disabled = !free.length;
      $("#add-rule").title = free.length ? t("addRuleHint") : t("allHaveRules");
    }

    function addRule() {
      const used = settings.layouts.rules.map(r => String(r.collection).toLowerCase());
      const name = collectionNames().find(n => !used.includes(n.toLowerCase()));
      if (!name) return;
      settings.layouts.rules.push({ collection: name, ...structuredClone(settings.layouts.collection) });
      renderRules();
      scheduleSave(true);
    }

    document.addEventListener("click", event => {
      if (event.target.id === "add-rule") addRule();
      const remove = event.target.dataset && event.target.dataset.remove;
      if (remove !== undefined) {
        settings.layouts.rules.splice(Number(remove), 1);
        renderRules();
        scheduleSave(true);
      }
    });

    // A change in the layout table.
    function onRuleChange(el) {
      const tr = el.closest("tr[data-row]");
      const id = tr.dataset.row;
      const L = settings.layouts;
      let row;
      if (id === "epub") {
        if (!Object.keys(L.epub).length) Object.assign(L.epub, structuredClone(L.collection));
        row = L.epub;
      } else row = id === "collection" ? L.collection : L.rules[Number(id)];
      const key = el.dataset.key;
      let value = el.type === "checkbox" ? el.checked : el.value;
      if (key === "columns") value = Number(value);
      if (key === "privateHeading") value = value.trim();
      row[key] = value;
      if (key === "applyToAll" && !value) delete row.applyToAll;
      if (key === "collection" || key === "applyToAll" || id === "epub") renderRules();
    }

    // The "select all" boxes follow their lists: ticked when every item is, half when some are.
    function syncSelectAll() {
      document.querySelectorAll("input[data-all]").forEach(all => {
        const items = [...document.querySelectorAll("input[data-group]")].filter(b => b.dataset.group === all.dataset.all || (all.dataset.all === "tag:" && b.dataset.group.startsWith("tag:")));
        const on = items.filter(b => b.checked).length;
        all.checked = items.length > 0 && on === items.length;
        all.indeterminate = on > 0 && on < items.length;
      });
    }

    // --- reading the form ------------------------------------------------------

    function chosenIn(group) {
      return Array.from(document.querySelectorAll(`input[data-group="${CSS.escape(group)}"]:checked`), el => el.value);
    }

    // One of the three lists of collections, read back from what is ticked
    // (the others, and rules for properties not in the notes, stay as they are).
    function commitLists(group) {
      const s = settings;
      if (group === "folders") {
        const tops = arrangement().output.filter(n => topFolders().notes.has(n));
        const folders = chosenIn("folders");
        s.collections.folders = !folders.length ? false : folders.length === tops.length && folders.every(f => tops.includes(f)) ? true : folders;
      } else if (group.startsWith("tag:")) {
        const tags = { ...(s.collections.tags || {}) };
        for (const field of vault.fields) {
          const picked = chosenIn("tag:" + field.name);
          if (picked.length) tags[field.name] = picked.length === field.values.length ? "*" : picked;
          else delete tags[field.name];
        }
        s.collections.tags = tags;
      } else if (group === "inline") {
        const inline = chosenIn("inline");
        s.collections.inlineTags = !inline.length ? false : inline.length === vault.inlineTags.length ? true : inline;
      }
      syncSelectAll();
    }

    function onChange(event) {
      const el = event.target;
      const s = settings;
      let rerender = false;

      if (el.dataset.text) {
        const value = el.value.trim();
        set(el.dataset.text, value || (el.dataset.empty || null));
        if (el.dataset.text === "site.title") $("#f-site-browserTitle").placeholder = value;
      } else if (el.dataset.bool) {
        set(el.dataset.bool, el.checked);
      } else if (el.dataset.range) {
        set(el.dataset.range, Number(el.value));
      } else if (el.name === "publish" || el.id === "publish-field") {
        const byField = $('input[name="publish"][value="field"]').checked;
        s.publish.require = byField ? ($("#publish-field").value.trim() || null) : null;
        // Not while typing the field name (the redraw would take focus).
        if (event.type === "change") refreshLists = true;
      } else if (el.dataset.all !== undefined) {
        const prefix = el.dataset.all;
        document.querySelectorAll("input[data-group]").forEach(b => { if (b.dataset.group === prefix || (prefix === "tag:" && b.dataset.group.startsWith("tag:"))) b.checked = el.checked; });
        commitLists(prefix);
      } else if (el.dataset.group) {
        commitLists(el.dataset.group);
      } else if (el.closest && el.closest("#rules")) {
        onRuleChange(el);
      } else {
        return;
      }

      if (rerender) {
        const y = window.scrollY;
        render();
        window.scrollTo(0, y);
      }
      scheduleSave(el.type !== "text");
    }

    // Dragging a folder into the pool, Input or Output.
    let dragging = null;
    const clearOver = () => document.querySelectorAll(".over").forEach(el => el.classList.remove("over"));
    document.addEventListener("dragstart", event => {
      const el = event.target.closest && event.target.closest("[data-folder]");
      if (!el) return;
      dragging = el.dataset.folder;
      event.dataTransfer.setData("text/plain", dragging);
      event.dataTransfer.effectAllowed = "move";
      // The picture that follows the pointer: a copy of the chip on its own, so
      // its rounded ends are not drawn on the background of the box it sits in.
      const ghost = el.cloneNode(true);
      ghost.querySelector("button")?.remove();
      ghost.classList.add("ghost");
      document.body.appendChild(ghost);
      event.dataTransfer.setDragImage(ghost, ghost.offsetWidth / 2, ghost.offsetHeight / 2);
      setTimeout(() => ghost.remove(), 0);
      setTimeout(() => el.classList.add("lifted"), 0);
    });
    document.addEventListener("dragover", event => {
      const zone = event.target.closest && event.target.closest("[data-zone]");
      if (!zone || dragging === null) return;
      event.preventDefault();
      clearOver();
      zone.classList.add("over");
    });
    document.addEventListener("drop", event => {
      const zone = event.target.closest && event.target.closest("[data-zone]");
      clearOver();
      if (!zone || dragging === null) return;
      event.preventDefault();
      const name = dragging;
      dragging = null;
      moveFolder(name, zone.dataset.zone);
    });
    document.addEventListener("dragend", () => { dragging = null; clearOver(); document.querySelectorAll(".lifted").forEach(el => el.classList.remove("lifted")); });
    document.addEventListener("click", event => {
      const back = event.target.closest && event.target.closest("[data-unplace]");
      if (back) moveFolder(back.dataset.unplace, "pool");
    });

    document.addEventListener("change", onChange);
    // Text fields save as you type (after a pause).
    document.addEventListener("input", event => { if (event.target.type === "text") onChange(event); });

    document.querySelectorAll(".lang button").forEach(button => button.addEventListener("click", () => {
      lang = button.dataset.lang;
      try { localStorage.setItem("md2book-settings-lang", lang); } catch { /* storage unavailable */ }
      const y = window.scrollY;
      render();
      window.scrollTo(0, y);
    }));

    fetch(API).then(async res => {
      // Anything but JSON: an older md2book, or the file opened on its own.
      if (!(res.headers.get("content-type") || "").includes("json")) throw Object.assign(new Error(), { needsServer: true });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || res.status);
      if (data.mode === "browser") useBrowserMode();
      if (data.mode === "repo") useRepoMode();
      defaults = data.defaults;
      // A copy: edits must never change `defaults` (saving compares the two).
      settings = merge(structuredClone(defaults), data.saved);
      if (data.saved.collections && data.saved.collections.tags) settings.collections.tags = data.saved.collections.tags;
      // Single notes follow their collections now (no row of their own).
      delete settings.layouts.note;
      vault = data.vault;
      showPath($("#file"), data.file);
      showPath($("#notes-dir"), data.notesDir);
      $("#open-site").href = data.homePath || "/";
      render();
    }).catch(error => {
      render.failed = true;
      document.querySelectorAll("[data-t]").forEach(el => { el.textContent = t(el.dataset.t); });
      if (error.needsServer) setStatus("needsServer", "", true);
      else setStatus("loadFailed", error.message, true);
    });
  })();
  </script>
</body>
</html>
